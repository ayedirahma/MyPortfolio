<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-cantine · Live Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111312;
      --ink: #f2f0ea;
      --muted: #9aa09b;
      --border: #2a2e2b;
      --primary: #7fcba0;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    h1 {
      font-family: "Fraunces", serif;
      font-weight: 400;
      font-size: clamp(2rem, 4vw, 3rem);
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      margin: 0;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    video {
      width: 100%;
      max-width: 1000px;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      background: #000;
    }
    .back-btn {
      margin-top: 40px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: transparent;
      color: var(--ink);
      text-decoration: none;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: 0.2s ease;
    }
    .back-btn:hover {
      background: var(--ink);
      color: var(--bg);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>E-cantine Demo</h1>
    <p>Live Recording</p>
  </div>

  <!-- CHANGE "my-video.mp4" TO YOUR ACTUAL VIDEO FILE NAME -->
  <video controls autoplay>
    <source src="../videos/E_cantine_demo.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  <a href="../index.html" class="back-btn">
    ← Back to Portfolio
  </a>

</body>
</html>
