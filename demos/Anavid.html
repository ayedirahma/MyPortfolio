<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anavid · Dashboards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #111312;
      --ink: #f2f0ea;
      --muted: #9aa09b;
      --border: #2a2e2b;
      --primary: #7fcba0;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
      padding: 40px 20px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      margin-bottom: 48px;
    }
    h1 {
      font-family: "Fraunces", serif;
      font-weight: 400;
      font-size: clamp(2rem, 4vw, 3rem);
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      margin: 0;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .gallery {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }
    .gallery-item {
      background: #1a1d1b;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      width: 100%;
      box-sizing: border-box;
    }
    .gallery-item img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      display: block;
    }
    .caption {
      margin-top: 16px;
      text-align: center;
      font-size: 1.1rem;
      font-family: "Fraunces", serif;
      color: var(--ink);
    }
    .back-btn {
      margin-top: 60px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      background: transparent;
      color: var(--ink);
      text-decoration: none;
      border: 1.5px solid var(--border);
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: 0.2s ease;
    }
    .back-btn:hover {
      background: var(--ink);
      color: var(--bg);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Anavid Dashboards</h1>
    <p>Performance & Monitoring Concepts</p>
  </div>

  <div class="gallery">
    <!-- Dashboard 1 -->
    <div class="gallery-item">
      <img src="../images/Anavid/ClientX.png" alt="Main Performance Dashboard">
      <div class="caption">ClientsX Performance Dashboard</div>
    </div>

    <!-- Dashboard 2 -->
    <div class="gallery-item">
      <img src="../images/Anavid/Export Annuel.png" alt="Real-time Alerts View">
      <div class="caption">Annuel Export for a client</div>
    </div>

    <!-- Dashboard 3 -->
    <div class="gallery-item">
      <img src="../images/Anavid/carrefour.png" alt="Historical Trends View">
      <div class="caption">Client Carrefour dashboard</div>
    </div>

    <!-- Dashboard 4 -->
    <div class="gallery-item">
      <img src="../images/Anavid/Parad'ice.png" alt="Store Monitoring View">
      <div class="caption">Client Parad'ice dashboard</div>
    </div>
  </div>

  <a href="../index.html" class="back-btn">
    ← Back to Portfolio
  </a>

</body>
</html>
